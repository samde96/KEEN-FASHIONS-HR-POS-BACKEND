server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: ${FASHIONPOS_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${FASHIONPOS_SESSION_COOKIE_SECURE:false}
        same-site: ${FASHIONPOS_SESSION_COOKIE_SAME_SITE:lax}
        path: /
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  application:
    name: keen-fashion-pos
  task:
    scheduling:
      pool:
        size: 2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${FASHIONPOS_DB_URL:jdbc:postgresql://localhost:5432/fashion_pos}
    username: ${FASHIONPOS_DB_USERNAME:fashion_pos_app}
    password: ${FASHIONPOS_DB_PASSWORD:change-me-local-only}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

app:
  mpesa:
    enabled: ${MPESA_ENABLED:false}
    environment: ${MPESA_ENVIRONMENT:sandbox}
    organization-id: ${MPESA_ORGANIZATION_ID:}
    consumer-key: ${MPESA_CONSUMER_KEY:}
    consumer-secret: ${MPESA_CONSUMER_SECRET:}
    passkey: ${MPESA_PASSKEY:}
    shortcode: ${MPESA_SHORTCODE:}
    party-b: ${MPESA_PARTY_B:}
    transaction-type: ${MPESA_TRANSACTION_TYPE:CustomerPayBillOnline}
    callback-base-url: ${MPESA_CALLBACK_BASE_URL:}
    callback-secret: ${MPESA_CALLBACK_SECRET_KEY:}
    encryption-key: ${MPESA_ENCRYPTION_KEY:}
    callback-allowed-ips: ${MPESA_CALLBACK_ALLOWED_IPS:196.201.214.200,196.201.214.206,196.201.213.114,196.201.214.207,196.201.214.208,196.201.213.44,196.201.212.127,196.201.212.138,196.201.212.129,196.201.212.136,196.201.212.74,196.201.212.69}
    trusted-proxies: ${MPESA_TRUSTED_PROXIES:}
    connect-timeout: 3s
    request-timeout: 8s
  daily-summary:
    scheduler-enabled: ${FASHIONPOS_DAILY_SUMMARY_SCHEDULER_ENABLED:true}
  bootstrap:
    organization-name: ${FASHIONPOS_ORGANIZATION_NAME:KEEN Fashions}
    currency-code: ${FASHIONPOS_CURRENCY_CODE:KES}
    time-zone: ${FASHIONPOS_TIME_ZONE:Africa/Nairobi}
    admin-display-name: ${FASHIONPOS_ADMIN_DISPLAY_NAME:Samuel Maina}
  security:
    admin-email: ${FASHIONPOS_ADMIN_EMAIL}
    admin-password: ${FASHIONPOS_ADMIN_PASSWORD}
    manager-email: ${FASHIONPOS_MANAGER_EMAIL:}
    manager-password: ${FASHIONPOS_MANAGER_PASSWORD:}
    cors:
      allowed-origin: ${FASHIONPOS_CORS_ALLOWED_ORIGIN:http://localhost:5173}
      allowed-origins: ${FASHIONPOS_CORS_ALLOWED_ORIGINS:${FASHIONPOS_CORS_ALLOWED_ORIGIN:http://localhost:5173}}
    rate-limit:
      login:
        enabled: ${FASHIONPOS_LOGIN_RATE_LIMIT_ENABLED:true}
        max-failed-attempts: ${FASHIONPOS_LOGIN_MAX_FAILED_ATTEMPTS:5}
        window: ${FASHIONPOS_LOGIN_RATE_LIMIT_WINDOW:15m}
        lockout: ${FASHIONPOS_LOGIN_RATE_LIMIT_LOCKOUT:15m}
  delivery:
    resend:
      api-key: ${RESEND_API_KEY:}
      from-email: ${RESEND_FROM_EMAIL:}
  notifications:
    scheduler-enabled: ${FASHIONPOS_NOTIFICATION_EMAIL_SCHEDULER_ENABLED:true}
